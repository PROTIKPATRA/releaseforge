apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: releaseforge-canary
  namespace: releaseforge
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: releaseforge-canary
  template:
    metadata:
      labels:
        app: releaseforge-canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: releaseforge
          image: releaseforge:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2.0.0-buggy"
            - name: APP_COLOR
              value: "canary"
            - name: FAIL_RATE
              value: "0.8"
            - name: LATENCY_MS
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 50
        - pause: { duration: 15s }
        - setWeight: 100
