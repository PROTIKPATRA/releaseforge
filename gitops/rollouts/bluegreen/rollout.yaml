apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: releaseforge-bg
  namespace: releaseforge
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: releaseforge
  template:
    metadata:
      labels:
        app: releaseforge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: releaseforge
          image: releaseforge:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2.0.0-buggy"
            - name: APP_COLOR
              value: "canary"
            - name: FAIL_RATE
              value: "0.5"
            - name: LATENCY_MS
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  strategy:
    blueGreen:
      activeService: releaseforge-active
      previewService: releaseforge-preview
      autoPromotionEnabled: false
