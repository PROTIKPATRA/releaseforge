apiVersion: v1
kind: Service
metadata:
  name: releaseforge-active
  namespace: releaseforge
spec:
  selector:
    app: releaseforge
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: releaseforge-preview
  namespace: releaseforge
spec:
  selector:
    app: releaseforge
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080